<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recorrido Virtual - Monumentos</title>
   <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Estilos propios -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container text-center py-5" id="main-content">
    <h1 class="mb-4">🌍 Recorrido Virtual de Monumentos</h1>
    <p class="lead mb-5">Explora algunos de los monumentos más emblemáticos del mundo en 3D</p>

    <div class="row g-4">
      <!-- Torre Eiffel -->
      <div class="col-md-4">
        <div class="menu-card h-100">
          <img src="img/torre-eiffel.jpg" class="card-img-top" alt="Torre Eiffel">
          <h4 class="mt-3">Torre Eiffel 🗼</h4>
          <a href="torre-eiffel.html" class="btn btn-card link">Explorar</a>
        </div>
      </div>
      <!-- Coliseo -->
      <div class="col-md-4">
        <div class="menu-card h-100">
          <img src="img/coliseo-romano.jpg" class="card-img-top" alt="Coliseo">
          <h4 class="mt-3">Coliseo Romano 🏛</h4>
          <a href="coliseo.html" class="btn btn-card link">Explorar</a>
        </div>
      </div>
      <!-- Chichen Itza -->
      <div class="col-md-4">
        <div class="menu-card h-100">
          <img src="img/chichen-itza.jpg" class="card-img-top" alt="Chichen-Itza">
          <h4 class="mt-3">Chichen Itzá 🛕</h4>
          <a href="chicen-itza.html" class="btn btn-card link">Explorar</a>
        </div>
      </div>
      <!-- Big Ben -->
      <div class="col-md-6">
        <div class="menu-card h-100">
          <img src="img/big-ben.jpg" class="card-img-top" alt="Big-Ben">
          <h4 class="mt-3">Big Ben 🕰️</h4>
          <a href="big-ben.html" class="btn btn-card link">Explorar</a>
        </div>
      </div>
      <!-- Stonehenge -->
      <div class="col-md-6">
        <div class="menu-card h-100">
          <img src="img/stonehenge.jpeg" class="card-img-top" alt="Stonehenge">
          <h4 class="mt-3">Stonehenge 🗿</h4>
          <a href="stonehenge.html" class="btn btn-card link">Explorar</a>
        </div>
      </div>
    </div>
  </div>

    <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script para transiciones suaves -->
  <script src="js/transitions.js"></script>
</body>
</html>
